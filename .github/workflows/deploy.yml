# Déploiement continu sur le serveur, via un runner GitHub auto-hébergé (étiquette « goodplace ») :
#   test → https://test.goodplace.ovh · preprod → https://preprod.goodplace.ovh · prod → https://goodplace.ovh
# Chaque mise en prod réussie reçoit un tag de version (voir deploy/next-version.sh) et une release GitHub.
# Seuls les push déclenchent ce workflow : le code des pull requests externes ne s'exécute jamais sur le serveur.
name: Déploiement

on:
  push:
    branches: [prod, preprod, test]

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, goodplace]
    environment:
      name: ${{ github.ref_name }}
      url: ${{ github.ref_name == 'prod' && 'https://goodplace.ovh' || format('https://{0}.goodplace.ovh', github.ref_name) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Déployer
        run: deploy/deploy.sh "${{ github.ref_name }}"

      - name: Taguer la version
        if: github.ref_name == 'prod'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git tag --points-at HEAD | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Commit déjà tagué : $(git tag --points-at HEAD)"
            exit 0
          fi
          previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)"
          version="$(deploy/next-version.sh)"
          notes="$(git log --no-merges --format='- %s' ${previous:+"$previous..HEAD"})"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            tag -a "$version" -m "GoodPlace $version" -m "$notes"
          git push origin "$version"
          body="$(python3 -c 'import json,sys; print(json.dumps({"tag_name": sys.argv[1], "name": sys.argv[1], "body": sys.argv[2]}))' "$version" "$notes")"
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" -d "$body" >/dev/null
          echo "Version mise en prod : $version" >> "$GITHUB_STEP_SUMMARY"
